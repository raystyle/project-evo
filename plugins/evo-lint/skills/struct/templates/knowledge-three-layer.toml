# struct 规则件:知识三层聚合仓(v2 标准,判例:browse_rs、pve-harness、ark_rs、clean-chrome)
[meta]
type = "knowledge-three-layer"

[required]
paths = ["AGENTS.md", "README.md", "CHANGELOG.md", "docs/sources/diary/", "docs/sources/INDEX.md", "docs/knowledge/adr/", "docs/knowledge/req/", "docs/knowledge/references/", "docs/knowledge/skill-impact.md", "docs/operations/INDEX.md"]

[generated]
paths = []
note = "双链图(graph)与索引为可再生面,头带生成声明"

[excluded]
paths = [".claude/settings.local.json", "node_modules/"]

[config-root]
paths = ["AGENTS.md"]
note = "纪律句在 AGENTS:git 边界三选一与加载视图声明"

[optional]
"docs/sources/external/" = "外档 verbatim 留底"
"docs/sources/evidence/" = "自产证据件与工件包"
"docs/knowledge/research/" = "S 结论页"
"docs/knowledge/mistakes/" = "M 坑模式页"
"docs/operations/skills/" = "标准技能唯一权威源(.claude/skills 是视图)"
layer-root = "docs/ 中心形或仓根形,仓自选唯一(既有仓迁移形见 distil-skill layers)"
