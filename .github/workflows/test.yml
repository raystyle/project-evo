name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync
      - name: pytest
        run: uv run pytest -q
      - name: smoke
        run: |
          uv run python .tools/check.py --help
          uv run python .tools/init.py "$RUNNER_TEMP/demo" --name demo
          uv run python .tools/check.py "$RUNNER_TEMP/demo"
          uv run python -c "import json, glob; files = ['.claude-plugin/marketplace.json', '.agents/plugins/marketplace.json', 'plugins/evo-doc/hooks/hooks.json'] + glob.glob('plugins/*/.claude-plugin/plugin.json') + glob.glob('plugins/*/.codex-plugin/plugin.json'); [json.load(open(p, encoding='utf-8')) for p in files]; print(len(files), 'json ok')"
